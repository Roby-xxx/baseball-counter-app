<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./fonts.css">

    <!-- Collegamento al manifest (Android/Chrome/Edge) -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Supporto specifico per iOS (iPhone / iPad) -->
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BB Counter">
    <link rel="stylesheet" href="./app-ui.css"> 
    <script src="./wakelock.js" defer></script>
    
    <title>Baseball Counter App</title>

    <style>
        :root{
            --bg:#f4f4f9;
            --card:#ffffff;
            --text:#1a1a1a;
            --primary:#246db5;
            --primary-hover:#1d5a96;
        }
        .dark{
            --bg:#111827;
            --card:#1f2937;
            --text:#f3f4f6;
            --primary:#246db5;
            --primary-hover:#5cadff;
        }
        *{
            box-sizing:border-box;
        }
        body{
            font-family:Arial,sans-serif;
            text-align:center;
            background-color:var(--bg);
            color:var(--text);
            transition:.3s;
            min-height:100vh;
            padding:30px 20px;
        }
        .container{
            max-width:400px;
            margin:auto;
        }
        h1{
            margin-bottom:20px;
        }
        .theme-container{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:12px;
            margin-bottom:10px;
        }
        .theme-toggle{
            position:relative;
            width:56px;
            height:32px;
            border:none;
            border-radius:999px;
            background:#d1d5db;
            cursor:pointer;
            transition:.3s;
        }
        .theme-toggle-knob{
            position:absolute;
            top:4px;
            left:4px;
            width:24px;
            height:24px;
            border-radius:50%;
            background:white;
            transition:.3s;
        }
        .theme-toggle.dark{
            background:#246db5;
        }
        .theme-toggle.dark .theme-toggle-knob{
            transform:translateX(24px);
        }
        .menu-list{
            display:flex;
            flex-direction:column;
            gap:15px;
        }
        .menu-btn{
            background-color:var(--primary);
            color:white;
            padding:15px;
            text-decoration:none;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
            box-shadow:0 4px 12px rgba(0,0,0,.15);
        }
        .menu-btn:hover{
            background-color:var(--primary-hover);
            transform:translateY(-2px);
        }
        .small-text{
            font-size:14px;
            opacity:.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="./icon.png" alt="BCA Logo" style="width: 60px; height: 60px; border-radius: 50%; margin: auto; margin-right: 0;">
        <h1>Baseball Counter App</h1>
        <div class="theme-container">
            <span>☀️</span>
            <button id="theme-toggle" class="theme-toggle">
                <span class="theme-toggle-knob"></span>
            </button>
            <span>🌙</span>
        </div>
        <br>
        <div class="menu-list">
            <a href="Scoreboard.html" class="menu-btn">Scoreboard</a>

            <a href="PitchCounter.html" class="menu-btn">Pitch Counter</a>

            <a href="SimpleStrikeCounter.html" class="menu-btn">Simple Strike Counter</a>

            <a href="AdvancedStrikeCounter.html" class="menu-btn">Advanced Strike Counter</a>
        </div>
        <div class="wakelock-control" style="margin-top: 10%;">
            <span style="color: #246db5; font-weight: bold;">Stay awake</span>
            <label class="switch">
                <input type="checkbox" id="toggle-wakelock">
                <span class="slider"></span>
            </label>
        </div>
        <div class="menu-list">
            <a href="readme.html" class="menu-btn" style="margin: auto; margin-top: 10%; max-width: 55%; min-width: 45%;">Readme</a>            
        </div>

    </div>

    <script>
        const htmlEl = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');

        function applyTheme(theme){
            if(theme === 'dark'){
                htmlEl.classList.add('dark');
                themeToggle.classList.add('dark');
            }
            else{
                htmlEl.classList.remove('dark');
                themeToggle.classList.remove('dark');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';

        applyTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
            const newTheme =
                htmlEl.classList.contains('dark')
                    ? 'light'
                    : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
